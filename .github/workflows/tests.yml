name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pest:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mouhim
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: mouhim_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mouhim"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: mouhim
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, intl, zip, gd, bcmath
          coverage: none

      - name: Install PostgreSQL 16 client (pg_dump / psql for backup tests)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style
        run: vendor/bin/pint --test

      - name: Tests
        run: vendor/bin/pest
